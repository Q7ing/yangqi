<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人脸识别 - 背景闪烁版</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 人脸识别全屏闪烁样式 - 覆盖外部CSS */
    body {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      display: block !important;
      background: transparent !important;
    }
    
    .face-recognition-page {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      background: transparent !important;
      overflow: hidden;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    
    .flashing-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      animation: flashColors 0.2s infinite;
    }
    
    @keyframes flashColors {
      0%   { background-color: #1a1a1a; }
      20%  { background-color: #2d2d2d; }
      40%  { background-color: #404040; }
      60%  { background-color: #1f1f1f; }
      80%  { background-color: #333333; }
      100% { background-color: #1a1a1a; }
    }
    
    .camera-view {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent !important;
    }
    
    .face-circle {
      position: relative;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      overflow: hidden;
      background: #000;
    }
    
    #camera-feed {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      transform: scaleX(-1) !important;
      position: relative !important;
      top: auto !important;
      left: auto !important;
    }
    
    .instruction-view {
      position: absolute !important;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      padding: 20px !important;
      background: transparent !important;
    }
    
    #instruction {
      color: #ffffff !important;
      font-size: 24px !important;
      font-weight: bold !important;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      margin: 0 !important;
      min-height: auto !important;
    }
  </style>
</head>
<body>
  <!-- 闪烁背景层 -->
  <div class="flashing-background" id="flashingBg"></div>
  
  <!-- 人脸识别独立容器 -->
  <div class="face-recognition-page">
    <div class="camera-view">
      <div class="face-circle">
        <video id="camera-feed" autoplay playsinline></video>
      </div>
    </div>
    <div class="instruction-view">
      <p id="instruction">请将面部置于圆框中</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('camera-feed');
      const instructionText = document.getElementById('instruction');
      const flashingBg = document.getElementById('flashingBg');

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
          video.srcObject = stream;

          // 开始背景闪烁（已经通过CSS动画自动开始）
          instructionText.textContent = "正在进行人脸识别...";
          
          setTimeout(() => {
            // 5秒后：停止闪烁
            flashingBg.style.animation = 'none';
            flashingBg.style.backgroundColor = '#1a1a1a';

            // 修改提示文字
            instructionText.textContent = "验证完成！";

            // 再延迟 1.5 秒，自动跳转
            setTimeout(() => {
              window.location.href = 'processing.html' + window.location.search;
            }, 1500);

          }, 5000); // 5秒闪烁时间

        } catch (err) {
          instructionText.textContent = "无法访问摄像头，请检查权限并刷新页面。";
          // 即使摄像头失败，也停止闪烁
          setTimeout(() => {
            flashingBg.style.animation = 'none';
            flashingBg.style.backgroundColor = '#1a1a1a';
          }, 5000);
        }
      }

      startCamera();
    });
  </script>
</body>
</html>
