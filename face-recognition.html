<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff; 
            color: #333333; 
            overflow: hidden; 
            transition: background-color 0.5s ease;
        }
        body.flashing-background { animation: rainbow-flash 3s linear infinite; }
        @keyframes rainbow-flash {
            0%, 100% { background-color: #ff4d4d; } 16% { background-color: #ff9a4d; } 32% { background-color: #ffd74d; } 48% { background-color: #4dff88; } 64% { background-color: #4dc4ff; } 80% { background-color: #6a4dff; } 94% { background-color: #c04dff; }
        }
        .face-recognition-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; position: relative; }
        
        /* 摄像头画面容器 */
        .camera-view {
            position: relative;
            /* 改动：调整为适中大小 */
            width: 320px;
            height: 320px;
            /* 改动：移除 border-radius，这是导致显示为圆形的关键错误 */
            /* border-radius: 50%; */ 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #camera-feed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .camera-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.7); border: 3px solid #007bff; box-sizing: border-box; }
        .instruction-view { margin-top: 30px; padding: 10px 20px; background-color: rgba(0, 0, 0, 0.7); border-radius: 20px; font-size: 1.2em; min-width: 250px; text-align: center; color: #ffffff; }
    </style>
</head>
<body>
    <div class="face-recognition-page">
        <div class="camera-view">
            <video id="camera-feed" autoplay playsinline></video>
            <div class="camera-mask"></div>
        </div>
        <div class="instruction-view">
            <p id="instruction">请直视摄像头</p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('camera-feed');
            const instructionText = document.getElementById('instruction');
            const body = document.body; 

            function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    video.srcObject = stream;
                    runVerificationSequence();
                } catch (err) {
                    instructionText.textContent = "无法访问摄像头，请检查权限并刷新页面。";
                    body.style.backgroundColor = '#1a1a1a';
                    instructionText.style.color = '#ffffff';
                }
            }

            async function runVerificationSequence() {
                // 改动：已移除多余的“权限已获取”提示
                instructionText.textContent = "请直视摄像头";
                await delay(2000);

                instructionText.textContent = "正在扫描，请保持不动...";
                body.classList.add('flashing-background');
                
                const scanDuration = Math.floor(Math.random() * 2000) + 2000;
                await delay(scanDuration);

                body.classList.remove('flashing-background');
                
                instructionText.textContent = "验证完成！";
                
                setTimeout(() => {
                    window.location.href = 'processing.html' + window.location.search;
                }, 1500);
            }

            startCamera();
        });
    </script>
</body>
</html>
