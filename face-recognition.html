<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: white; /* Initial white background */
            transition: background-color 0.5s ease-in-out;
        }
        .face-recognition-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: transparent; /* Let body handle the background */
        }
        .camera-view {
            position: relative;
            width: 300px; /* Adjust as needed */
            height: 300px; /* Adjust as needed */
            border-radius: 50%;
            overflow: hidden;
            background-color: #333; /* Dark background for the camera area */
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror the camera feed */
        }
        .camera-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); /* Dark overlay outside the circle */
            border-radius: 50%;
        }
        .instruction-view {
            margin-top: 20px;
            font-size: 1.5em;
            color: #333;
            text-align: center;
        }
        /* Styles for flashing background */
        .flash-bg-dark {
            background-color: #1a1a1a; /* Darker shade */
        }
        .flash-bg-light {
            background-color: #333333; /* Lighter dark shade */
        }
    </style>
</head>
<body>
    <div class="face-recognition-page">
        <div class="camera-view">
            <video id="camera-feed" autoplay playsinline></video>
            <div class="camera-mask"></div>
        </div>
        <div class="instruction-view">
            <p id="instruction">请将面部置于圆框中</p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('camera-feed');
            const instructionText = document.getElementById('instruction');
            const body = document.body;

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    video.srcObject = stream;
                    
                    // Initial white background for 2.5 seconds
                    body.style.backgroundColor = 'white';
                    instructionText.style.color = '#333'; // Ensure text is visible on white
                    await new Promise(resolve => setTimeout(resolve, 2500)); 
                    
                    // After 2.5 seconds, change to a default dark background for the camera sequence
                    body.style.backgroundColor = '#333'; 
                    instructionText.style.color = 'white'; // Change text color for dark background
                    runVerificationSequence();

                } catch (err) {
                    instructionText.textContent = "无法访问摄像头，请检查权限并刷新页面。";
                    instructionText.style.color = '#333'; // Keep text visible if camera fails
                }
            }

            function runTask(taskName, duration) {
                return new Promise(resolve => {
                    instructionText.textContent = taskName;
                    setTimeout(resolve, duration * 1000);
                });
            }

            async function flashBackground(duration) {
                const startTime = Date.now();
                while (Date.now() - startTime < duration * 1000) {
                    body.classList.toggle('flash-bg-dark');
                    body.classList.toggle('flash-bg-light');
                    await new Promise(resolve => setTimeout(resolve, 100)); // Flash every 100ms
                }
                body.classList.remove('flash-bg-dark', 'flash-bg-light'); // Clean up classes
                body.style.backgroundColor = '#333'; // Revert to a consistent dark background
            }

            async function runVerificationSequence() {
                const actions = ['请眨眨眼', '请直视摄像头']; // Updated actions
                const shuffledActions = actions.sort(() => 0.5 - Math.random());
                
                for (const task of shuffledActions) {
                    let duration = Math.floor(Math.random() * 2) + 2; // Random 2-3 seconds for tasks
                    await runTask(task, duration);
                }
                
                // Dark background fast flash for 4 seconds
                instructionText.textContent = "正在进行生物识别...";
                await flashBackground(4); 
                
                instructionText.textContent = "验证完成！";
                
                setTimeout(() => {
                    window.location.href = 'processing.html' + window.location.search;
                }, 1500);
            }

            startCamera();
        });
    </script>
</body>
</html>
