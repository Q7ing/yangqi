<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>人脸识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .face-recognition-page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .camera-view {
            width: 80vw;
            height: 80vw;
            max-width: 300px;
            max-height: 300px;
            border-radius: 50%;
            overflow: hidden;
            position: absolute;
            /* 新增：为辉光效果添加过渡动画，使其变化更平滑 */
            transition: box-shadow 0.12s ease-out;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            
            mask: radial-gradient(circle at center, transparent 40vw, black 0);
            -webkit-mask: radial-gradient(circle at center, transparent 40vw, black 0);
            
            -webkit-mask-size: 300px 300px;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;

            opacity: 0;
            transition: opacity 0.5s ease, background-color 0.1s ease;
        }
        
        .overlay.visible {
            opacity: 1;
        }

        .instruction-view {
            position: relative;
            z-index: 10;
            margin-top: 50vh;
            font-size: 1.2rem;
            color: #333;
            text-align: center;
            transition: color 0.5s ease;
        }
        .overlay.visible ~ .instruction-view {
             color: white;
        }

    </style>
</head>
<body>
    <div class="face-recognition-page">
        <div class="camera-view" id="camera-view">
            <video id="camera-feed" autoplay playsinline></video>
        </div>
        <div class="overlay" id="overlay"></div>
        <div class="instruction-view">
            <p id="instruction">请将面部置于圆框中</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('camera-feed');
            const instructionText = document.getElementById('instruction');
            const overlay = document.getElementById('overlay');
            // 新增：获取 camera-view 元素用于添加辉光
            const cameraView = document.getElementById('camera-view');

            const flashColors = [
                '#B71C1C', '#E65100', '#F57F17', '#1B5E20',
                '#0D47A1', '#004D40', '#4A148C'
            ];

            function runColorFlash(duration) {
                return new Promise(resolve => {
                    const intervalId = setInterval(() => {
                        const randomColor = flashColors[Math.floor(Math.random() * flashColors.length)];
                        // 1. 改变背景颜色
                        overlay.style.backgroundColor = randomColor;
                        // 2. 新增：让圆框边缘发出同样颜色的辉光
                        cameraView.style.boxShadow = `0 0 25px 5px ${randomColor}`;
                    }, 120);

                    setTimeout(() => {
                        clearInterval(intervalId);
                        overlay.style.backgroundColor = '#1a1a1a';
                        // 新增：清除辉光效果
                        cameraView.style.boxShadow = 'none';
                        resolve();
                    }, duration);
                });
            }

            async function runSequence() {
                await new Promise(resolve => setTimeout(resolve, 2500));
                
                overlay.classList.add('visible');
                instructionText.textContent = '请直视摄像头';
                await new Promise(resolve => setTimeout(resolve, 2500));

                instructionText.textContent = '正在进行扫描';
                await runColorFlash(4000);
                
                instructionText.textContent = "验证完成！";
                
                setTimeout(() => {
                    window.location.href = 'processing.html' + window.location.search;
                }, 1500);
            }

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    video.srcObject = stream;
                    video.onplaying = runSequence;
                } catch (err) {
                    instructionText.textContent = "无法访问摄像头，请检查权限。";
                }
            }

            startCamera();
        });
    </script>
</body>
</html>
