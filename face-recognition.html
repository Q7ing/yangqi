<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人脸识别 - 背景闪烁版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="face-recognition-page">
    <div class="camera-view">
      <div class="flash-bg"></div> <!-- 背景闪烁层 -->
      <video id="camera-feed" autoplay playsinline></video>
      <div class="camera-mask"></div>
    </div>
    <div class="instruction-view">
      <p id="instruction">请将面部置于圆框中</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('face-recognition-mode');

      const video = document.getElementById('camera-feed');
      const instructionText = document.getElementById('instruction');
      const flashBg = document.querySelector('.flash-bg');

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
          video.srcObject = stream;

          // 开始背景闪烁
          flashBg.style.display = 'block';
          setTimeout(() => {
            // 5 秒后：停止闪烁
            flashBg.style.animation = 'none';
            flashBg.style.backgroundColor = '#111';

            // 修改提示文字
            instructionText.textContent = "验证完成！";

            // 再延迟 1.5 秒，自动跳转到 processing.html
            setTimeout(() => {
              window.location.href = 'processing.html' + window.location.search;
            }, 1500);

          }, 5000);

        } catch (err) {
          instructionText.textContent = "无法访问摄像头，请检查权限并刷新页面。";
        }
      }

      startCamera();
    });
  </script>
</body>
</html>
