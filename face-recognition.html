<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人脸识别 - 背景闪烁版</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 人脸识别全屏闪烁样式 - 覆盖外部CSS */
    body {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      display: block !important;
      background: transparent !important;
    }
    
    .face-recognition-page {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      background: transparent !important;
      overflow: hidden;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    
    .flashing-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background-color: #000000;
      /* 初始不闪烁，等待摄像头权限 */
    }
    
    .flashing-background.active {
      animation: flashColors 1.2s infinite;  /* 从0.6s调整为1.2s */
    }
    
    @keyframes flashColors {
      0%   { background-color: #8B0000; }  /* 深红色 */
      16%  { background-color: #B8860B; }  /* 深金黄色 */
      32%  { background-color: #000080; }  /* 深蓝色 */
      48%  { background-color: #006400; }  /* 深绿色 */
      64%  { background-color: #4B0082; }  /* 靛紫色 */
      80%  { background-color: #8B008B; }  /* 深洋红色 */
      100% { background-color: #8B0000; } /* 回到深红色 */
    }
    
    .camera-view {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent !important;
    }
    
    .face-circle {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%; /* 恢复圆形 */
      border: 4px solid #ffffff;
      /* 边框颜色动画，跟随背景色 */
      animation: borderColorChange 1.2s infinite;
      overflow: hidden;
      background: #000;
    }
    
    @keyframes borderColorChange {
      0%   { border-color: #8B0000; }  /* 深红色 */
      16%  { border-color: #B8860B; }  /* 深金黄色 */
      32%  { border-color: #000080; }  /* 深蓝色 */
      48%  { border-color: #006400; }  /* 深绿色 */
      64%  { border-color: #4B0082; }  /* 靛紫色 */
      80%  { border-color: #8B008B; }  /* 深洋红色 */
      100% { border-color: #8B0000; } /* 回到深红色 */
    }
    
    /* 摄像头启动前，边框保持白色 */
    .face-circle.inactive {
      animation: none;
      border-color: #ffffff;
    }
    
    #camera-feed {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      transform: scaleX(-1) !important;
      position: relative !important;
      top: auto !important;
      left: auto !important;
    }
    
    .instruction-view {
      position: absolute !important;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      padding: 20px !important;
      background: transparent !important;
    }
    
    #instruction {
      color: #ffffff !important;
      font-size: 24px !important;
      font-weight: bold !important;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      margin: 0 !important;
      min-height: auto !important;
    }
  </style>
</head>
<body>
  <!-- 闪烁背景层 -->
  <div class="flashing-background" id="flashingBg"></div>
  
  <!-- 人脸识别独立容器 -->
  <div class="face-recognition-page">
    <div class="camera-view">
      <div class="face-circle inactive" id="faceCircle">
        <video id="camera-feed" autoplay playsinline></video>
      </div>
    </div>
    <div class="instruction-view">
      <p id="instruction">请将面部置于圆框中</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('camera-feed');
      const instructionText = document.getElementById('instruction');
      const flashingBg = document.getElementById('flashingBg');
      const faceCircle = document.getElementById('faceCircle');

      async function startCamera() {
        try {
          // 去除"正在请求摄像头权限"文字，直接请求权限
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
          
          video.srcObject = stream;
          
          // 摄像头权限获取成功后，开始闪烁
          flashingBg.classList.add('active'); // 开始背景闪烁
          faceCircle.classList.remove('inactive'); // 开始边框颜色动画
          
          setTimeout(() => {
            // 7秒后：停止闪烁并直接跳转
            flashingBg.classList.remove('active');
            flashingBg.style.backgroundColor = '#000000'; // 变成黑色
            faceCircle.classList.add('inactive'); // 停止边框动画，恢复白色

            // 直接跳转，不显示验证完成文字
            window.location.href = 'processing.html' + window.location.search;

          }, 6000); // 7秒闪烁时间

        } catch (err) {
          instructionText.textContent = "无法访问摄像头，请允许摄像头权限并刷新页面。";
          // 摄像头权限被拒绝，设置为黑色，但不跳转
          flashingBg.style.backgroundColor = '#000000';
          // 不跳转，让用户手动刷新页面重新授权
        }
      }

      startCamera();
    });
  </script>
</body>
</html>
