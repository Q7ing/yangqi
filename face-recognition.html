<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>人脸识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            /* 1. 初始为不透明白色背景 */
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .face-recognition-page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* 摄像头画面容器，位于最底层 */
        .camera-view {
            width: 80vw;
            height: 80vw;
            max-width: 300px;
            max-height: 300px;
            border-radius: 50%;
            overflow: hidden;
            position: absolute;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* 遮罩层，位于最顶层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #333;
            
            /* 关键：使用 mask 技术创建圆形镂空，兼容性好 */
            mask: radial-gradient(circle at center, transparent 40vw, black 0);
            /* 针对不同浏览器内核的兼容性写法 */
            -webkit-mask: radial-gradient(circle at center, transparent 40vw, black 0); 
            /* 限制镂空区域的最大尺寸 */
            -webkit-mask-size: 300px 300px;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;

            /* 初始时完全透明，不显示 */
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        /* 当遮罩层需要显示时，改变其不透明度 */
        .overlay.visible {
            opacity: 1;
        }
        
        /* 闪烁效果的动画 */
        @keyframes flash {
            0%, 100% { background-color: #1a1a1a; }
            50% { background-color: #4a4a4a; }
        }
        
        /* 将闪烁动画应用到遮罩层上 */
        .overlay.flashing {
            animation: flash 0.25s infinite;
        }

        .instruction-view {
            position: relative; /* 确保文字在最上层 */
            z-index: 10;
            margin-top: 50vh; /* 将文字定位到圆圈下方 */
            font-size: 1.2rem;
            color: #333; /* 初始文字颜色，配合白色背景 */
            text-align: center;
            transition: color 0.5s ease;
        }
        .overlay.visible ~ .instruction-view {
             color: white; /* 当遮罩出现时，文字变白色 */
        }

    </style>
</head>
<body>
    <div class="face-recognition-page">
        <div class="camera-view">
            <video id="camera-feed" autoplay playsinline></video>
        </div>
        
        <div class="overlay" id="overlay"></div>

        <div class="instruction-view">
            <p id="instruction">请将面部置于圆框中</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('camera-feed');
            const instructionText = document.getElementById('instruction');
            const overlay = document.getElementById('overlay');

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    video.srcObject = stream;
                    video.onplaying = runSequence; // 等待视频开始播放再执行流程
                } catch (err) {
                    instructionText.textContent = "无法访问摄像头，请检查权限。";
                }
            }

            async function runSequence() {
                // 1. 页面已是白色背景，保持 2.5 秒
                await new Promise(resolve => setTimeout(resolve, 2500));
                
                // 2. 显示深色遮罩层
                overlay.classList.add('visible');
                instructionText.textContent = '请直视摄像头';
                await new Promise(resolve => setTimeout(resolve, 2500));

                // 3. 开始闪烁遮罩层
                instructionText.textContent = '正在进行扫描';
                overlay.classList.add('flashing');
                await new Promise(resolve => setTimeout(resolve, 4000));
                
                // 4. 停止闪烁并显示结果
                overlay.classList.remove('flashing');
                instructionText.textContent = "验证完成！";
                
                // 5. 跳转页面
                setTimeout(() => {
                    console.log("跳转到 processing.html");
                    // window.location.href = 'processing.html' + window.location.search;
                }, 1500);
            }

            startCamera();
        });
    </script>
</body>
</html>
