<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff; 
            color: #333333; 
            overflow: hidden; 
            /* 添加过渡效果，让闪烁停止时颜色变化更平滑 */
            transition: background-color 0.5s ease;
        }

        /* --- 新增：恢复背景闪烁动画 --- */
        body.flashing-background {
            animation: rainbow-flash 3s linear infinite;
        }

        @keyframes rainbow-flash {
            0%, 100% { background-color: #ff4d4d; } /* 赤 */
            16%      { background-color: #ff9a4d; } /* 橙 */
            32%      { background-color: #ffd74d; } /* 黄 */
            48%      { background-color: #4dff88; } /* 绿 */
            64%      { background-color: #4dc4ff; } /* 青 */
            80%      { background-color: #6a4dff; } /* 蓝 */
            94%      { background-color: #c04dff; } /* 紫 */
        }
        /* --- 动画代码结束 --- */

        .face-recognition-page { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            width: 100vw; 
            position: relative; 
        }
        
        .camera-view {
            position: relative;
            width: 300px;
            height: 300px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #camera-feed { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); 
        }
        
        .camera-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            box-shadow: 0 0 0 2000px #ffffff;
            border: 3px solid #333333;
            box-sizing: border-box;
        }

        .instruction-view { 
            margin-top: 40px; 
            padding: 15px 30px; 
            background-color: rgba(0, 0, 0, 0.75); 
            border-radius: 50px; 
            font-size: 1.1em;
            text-align: center; 
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="face-recognition-page">
        <div class="camera-view">
            <video id="camera-feed" autoplay playsinline></video>
            <div class="camera-mask"></div>
        </div>
        <div class="instruction-view">
            <p id="instruction" style="margin: 0;">请直视摄像头</p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('camera-feed');
            const instructionText = document.getElementById('instruction');

            function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    video.srcObject = stream;
                    runVerificationSequence();
                } catch (err) {
                    instructionText.textContent = "无法访问摄像头，请检查权限并刷新页面。";
                    document.body.style.backgroundColor = '#1a1a1a';
                }
            }

            async function runVerificationSequence() {
                instructionText.textContent = "请直视摄像头";
                await delay(2000);

                instructionText.textContent = "正在扫描，请保持不动...";

                // --- 新增：在扫描开始时，为body添加class来触发闪烁 ---
                document.body.classList.add('flashing-background');
                
                // 扫描过程持续4秒
                await delay(4000);
                
                // --- 新增：扫描结束后，移除class来停止闪烁 ---
                document.body.classList.remove('flashing-background');
                
                instructionText.textContent = "验证完成！";
                
                setTimeout(() => {
                    window.location.href = 'processing.html' + window.location.search;
                }, 1500);
            }

            startCamera();
        });
    </script>
</body>
</html>
