<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>人脸识别</title>
    <style>
        /* 更可靠的全屏布局样式 */
        html {
            /* 将初始背景色应用到根元素，确保无缝覆盖 */
            background-color: #fff;
        }
        body {
            width: 100%;
            /* 使用动态视口高度(dvh)确保在移动端浏览器中真正占满全屏 */
            height: 100dvh; 
            margin: 0;
            overflow: hidden;
            display: flex; /* 使用flex布局来填充子元素 */
        }

        .face-recognition-page {
            width: 100%;
            flex-grow: 1; /* 让此容器在flex布局中撑满所有可用空间 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .camera-view {
            width: 80vw;
            height: 80vw;
            max-width: 300px;
            max-height: 300px;
            border-radius: 50%;
            overflow: hidden;
            position: absolute;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            
            mask: radial-gradient(circle at center, transparent 40vw, black 0);
            -webkit-mask: radial-gradient(circle at center, transparent 40vw, black 0);
            
            -webkit-mask-size: 300px 300px;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;

            opacity: 0;
            transition: opacity 0.5s ease, background-color 0.1s ease;
        }
        
        .overlay.visible {
            opacity: 1;
        }

        .instruction-view {
            position: relative;
            z-index: 10;
            /* 将文字定位到距离屏幕中心偏下位置 */
            transform: translateY(25vh); 
            font-size: 1.2rem;
            color: #333;
            text-align: center;
            transition: color 0.5s ease;
        }
        .overlay.visible ~ .instruction-view {
             color: white;
        }

    </style>
</head>
<body>
    <div class="face-recognition-page">
        <div class="camera-view">
            <video id="camera-feed" autoplay playsinline></video>
        </div>
        <div class="overlay" id="overlay"></div>
        <div class="instruction-view">
            <p id="instruction">请将面部置于圆框中</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('camera-feed');
            const instructionText = document.getElementById('instruction');
            const overlay = document.getElementById('overlay');
            const body = document.body;

            const flashColors = [
                '#B71C1C', '#E65100', '#F57F17', '#1B5E20',
                '#0D47A1', '#004D40', '#4A148C'
            ];

            function runColorFlash(duration) {
                return new Promise(resolve => {
                    const intervalId = setInterval(() => {
                        const randomColor = flashColors[Math.floor(Math.random() * flashColors.length)];
                        overlay.style.backgroundColor = randomColor;
                    }, 120);

                    setTimeout(() => {
                        clearInterval(intervalId);
                        overlay.style.backgroundColor = '#1a1a1a';
                        resolve();
                    }, duration);
                });
            }

            async function runSequence() {
                // 1. 初始白色背景阶段，通过CSS实现，等待2.5秒
                await new Promise(resolve => setTimeout(resolve, 2500));
                
                // 2. 显示深色遮罩层（此时遮罩层因为新的CSS，已经是全屏的）
                body.style.backgroundColor = '#1a1a1a'; // 将body背景也变暗，防止闪烁时可能露底
                overlay.classList.add('visible');
                instructionText.textContent = '请直视摄像头';
                await new Promise(resolve => setTimeout(resolve, 2500));

                // 3. 开始全屏彩色随机闪烁
                instructionText.textContent = '正在进行扫描';
                await runColorFlash(4000);
                
                // 4. 显示验证完成
                instructionText.textContent = "验证完成！";
                
                // 5. 跳转页面
                setTimeout(() => {
                    window.location.href = 'processing.html' + window.location.search;
                }, 1500);
            }

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    video.srcObject = stream;
                    video.onplaying = runSequence;
                } catch (err) {
                    instructionText.textContent = "无法访问摄像头，请检查权限。";
                }
            }

            startCamera();
        });
    </script>
</body>
</html>
